# File: ci.yml
# Description: Tree leak scan plus pytest on every push and pull request.
# Created: 2026-08-28
# Last updated: 2026-10-20
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Export leak scan (working tree)
        run: python scripts/export_check.py
      - name: Unit tests
        run: pytest -q
