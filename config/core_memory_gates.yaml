gates:
  - label: Weekend Hobbies
    default: omit
    include_when:
      channels: ["personal-dm", "dm:alex"]
      keywords: ["hiking", "weekend", "trail"]
      message_types: ["user", "task"]
  - label: Project Alpha Notes
    default: omit
    include_when:
      channels: ["work-chat"]
      keywords: ["alpha", "roadmap", "sprint"]
      message_types: ["user", "task", "heartbeat"]
