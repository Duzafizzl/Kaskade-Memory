[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaskade-memory"
version = "0.1.0"
description = "Hierarchical memory engine for coding agents — cascade rollups, ERIP privacy tagging, Gnostic graph search, and EOD maintenance."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "psycopg[binary,pool]>=3.1",
  "pgvector>=0.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kaskade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
